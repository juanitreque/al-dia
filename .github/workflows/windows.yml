name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:

# Por defecto, solo lectura. Únicamente el trabajo «release» puede escribir.
permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test AlDia.slnx -c Release

      - name: Versión
        id: version
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          if ($env:ETIQUETA -like "windows-v*") { $v = $env:ETIQUETA -replace '^windows-v', '' } else { $v = "0.0.0-dev" }
          $numero = $v -replace '-.*$', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          "numero=$numero" >> $env:GITHUB_OUTPUT

      - name: Publicar
        run: dotnet publish src/AlDia -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.numero }} -o publish/win-x64

      - name: Instalador
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.7.1 -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DVersion=${{ steps.version.outputs.version }} installer/AlDia.iss

      - name: Zip portable
        # Una sola carpeta «Al Dia» dentro del zip, sin los archivos de depuración (.pdb)
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item publish/win-x64 "portable/Al Dia" -Recurse
          Get-ChildItem "portable/Al Dia" -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path "portable/Al Dia" -DestinationPath "installer/salida/AlDia-Windows-${{ steps.version.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AlDia-Windows-${{ steps.version.outputs.version }}
          path: windows/installer/salida/*

  release:
    # Solo al publicar una etiqueta windows-v*; es el único trabajo con permiso de escritura.
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: windows/installer/NOTAS.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: AlDia-Windows-${{ needs.compilar.outputs.version }}
          path: salida

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compilar.outputs.version }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          pre=""
          if [[ "$VERSION" == *-* ]]; then pre="--prerelease"; fi
          gh release create "$ETIQUETA" salida/* --title "Al Día para Windows $VERSION" --notes-file windows/installer/NOTAS.md $pre
